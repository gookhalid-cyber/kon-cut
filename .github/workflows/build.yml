name: Kon Cut — test & package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Allow required install scripts (npm 11)
        shell: bash
        run: npm install-scripts approve --all || true
      - run: npm ci
      - name: Unit + UI tests
        run: npm run test:all

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Allow required install scripts (npm 11)
        shell: bash
        run: npm install-scripts approve --all || true
      - run: npm ci

      - name: Stage FFmpeg, Python, ONNX models and Whisper
        run: node scripts/prepare-runtime.mjs
        env:
          KONCUT_SKIP_MODEL_DOWNLOAD: '0'

      - name: Build NSIS installer + portable exe
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kon-cut-${{ github.ref_name }}
          path: |
            dist/*.exe
          if-no-files-found: error
